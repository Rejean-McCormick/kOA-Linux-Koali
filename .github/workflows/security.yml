name: CI / Security

# DEEP gate: intentionally decoupled from the normal push loop.
# It still runs automatically once a week and can be launched on demand.
"on":
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Synchronize frozen workspace
        run: uv sync --frozen --all-groups
      - name: Run security validation
        run: uv run --frozen python ci/scripts/run-security.py
