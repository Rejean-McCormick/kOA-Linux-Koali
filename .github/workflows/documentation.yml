name: CI / Documentation

"on":
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Synchronize frozen workspace
        run: uv sync --frozen --all-groups
      - name: Validate documentation
        run: uv run --frozen python docs/tools/validate_docs.py
