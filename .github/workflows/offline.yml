name: CI / Offline

# DEEP gate: offline/reproducibility checks are valuable, but too heavy for
# every development push. Run weekly and on demand instead.
"on":
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Synchronize frozen workspace
        run: uv sync --frozen --all-groups
      - name: Run offline validation
        run: uv run --frozen python ci/scripts/run-offline.py

  reproducibility:
    name: reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Synchronize frozen workspace
        run: uv sync --frozen --all-groups
      - name: Run reproducibility validation
        run: uv run --frozen python ci/scripts/run-reproducibility.py
