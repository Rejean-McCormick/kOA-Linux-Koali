name: CI / Contracts

"on":
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Synchronize frozen workspace
        run: uv sync --frozen --all-groups
      - name: Run contract validation
        run: uv run --frozen python ci/scripts/run-contracts.py
