[build-system]
requires = ["setuptools>=82,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "koa-operations"
version = "0.1.0"
description = "Bounded kOA operational coordination and backup lifecycle CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.26,<5"]

[project.scripts]
koa-operations = "koa_operations.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["koa_operations*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
