[build-system]
requires = ["setuptools>=82,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "koa-audit-broker"
version = "0.1.0"
description = "Bounded selective-audit, evidence, and receipt service for kOA-Linux"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-kOA-Linux"
authors = [{ name = "kOA-Linux contributors" }]
dependencies = []

[project.scripts]
koa-audit-broker = "koa_audit_broker.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["koa_audit_broker*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]
