schema_version = "1.0.0"
payload_id = "kristal-runtime-component"
component_id = "kristal_runtime"
component_version = "2.0.0"
component_contract = "docs/contracts/components/kristal-runtime.component.json"
runtime_pack_schema = "docs/contracts/artifact-contracts/runtime-pack.schema.json"
kristal_state_schema = "docs/contracts/artifact-contracts/kristal-state.schema.json"
kristal_reader_policy_schema = "docs/contracts/artifact-contracts/kristal-reader-policy.schema.json"
kristal_standard_version = "6.0.0"
kristal_canonicalization_profile = "kristal.v6:jcs-rfc8785"
kristal_consumer_lock = "docs/contracts/integrations/kristal-v6.0.0.consumer-lock.json"
kristal_standard_manifest = "docs/contracts/integrations/kristal-v6.0.0.standard-manifest.sha256.json"
kristal_artifact_schema = "docs/contracts/artifact-contracts/kristal-artifact.schema.json" # legacy compatibility
payload_class = "python-component"
source_root = "components/kristal-runtime"
public_api = "koa_kristal_runtime.api"
service_entrypoint = "koa_kristal_runtime.__main__:main"
generated = false

[authority]
content_identity_owner = "kristal_runtime"
runtime_pack_state_owner = "kristal_runtime"
artifact_trust_owner = "identity_and_trust"
resource_authority_owner = "resource_governor"
policy_authority_owner = "governance_policy_runtime"
evidence_custody_owner = "audit_broker"
host_privilege_owner = "koa_node_agent"
release_channel_owner = "knowledge_release_channel"
direct_cross_component_database_access = false
partial_authoritative_activation = false
unverified_artifact_execution = false
implicit_downgrade_or_substitution = false
native_or_automatic_external_ai = false

[installation]
code_root = "/usr/lib/koa/active/services/kristal-runtime"
configuration_root = "/etc/koa/components/kristal-runtime"
state_root = "/var/lib/koa/kristal"
runtime_root = "/run/koa/kristal-runtime"
receipt_root = "/var/lib/koa/receipts/kristal-runtime"
quarantine_root = "/var/lib/koa/quarantine/kristal-runtime"
cache_root = "/var/cache/koa/kristal-runtime"
socket_path = "/run/koa/sockets/kristal-runtime.sock"

[[include]]
source = "src/koa_kristal_runtime"
destination = "python/koa_kristal_runtime"
kind = "tree"
mutable = false

[[include]]
source = "migrations"
destination = "migrations"
kind = "tree"
mutable = false

[[interface]]
interface_id = "kristal_identity_resolution"
version = "1.0.0"
interaction = "query"

[[interface]]
interface_id = "runtime_pack_validation"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "runtime_pack_activation"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "runtime_pack_rollback"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "runtime_status_query"
version = "1.0.0"
interaction = "query"
